# Publishes the download website (the site/ folder) with GitHub Pages and points it at THIS repository's releases.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: site
on:
  push: { branches: [main], paths: ["WhiteShadow-Build-Kit/site/**"] }
  workflow_run: { workflows: ["release"], types: [completed] }     # publishes the site automatically after a release is built
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the site at this repository's releases
        run: sed -i "s|window.RELEASE_REPO = \"[^\"]*\"|window.RELEASE_REPO = \"${GITHUB_REPOSITORY}\"|" WhiteShadow-Build-Kit/site/config.js && cat WhiteShadow-Build-Kit/site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: WhiteShadow-Build-Kit/site }
      - id: deployment
        uses: actions/deploy-pages@v4
