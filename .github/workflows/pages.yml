# Publishes the download website (the site/ folder) with GitHub Pages and points it at THIS repository's releases.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the site files exist and point to this repository's releases
        shell: bash
        run: |
          mkdir -p site
          if [ ! -f site/config.js ]; then
            printf 'window.RELEASE_REPO = "%s";\nwindow.RELEASE_TAG = "latest";\n' "$GITHUB_REPOSITORY" > site/config.js
          else
            sed -i "s|window.RELEASE_REPO = \"[^\"]*\"|window.RELEASE_REPO = \"${GITHUB_REPOSITORY}\"|" site/config.js
          fi
          if [ ! -f site/index.html ]; then
            cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>White Shadow</title>
          </head>
          <body>
            <h1>White Shadow</h1>
            <p><a id="release" href="#">Download the latest release</a></p>
            <script src="./config.js"></script>
            <script>
              document.getElementById('release').href = `https://github.com/${window.RELEASE_REPO}/releases/latest`;
            </script>
          </body>
          </html>
          EOF
          fi
          cat site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
